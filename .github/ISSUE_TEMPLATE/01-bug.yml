name: Bug Report
description: Report a reproducible bug or unexpected behavior in Nutre.
title: "[BUG]: "
labels:
  - bug
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Use this template to report a reproducible problem.
        Please search existing issues before creating a new one.

  - type: checkboxes
    id: preliminary_checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this problem.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: |
        Describe what is happening and where it occurs.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What happens instead?
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected Area
      options:
        - Frontend
        - Layout / UI
        - Authentication
        - User Profile
        - Dietary Preferences
        - Menu Generation
        - Database
        - API
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment information.
      placeholder: |
        Browser:
        Operating System:
        Device:
        Screen size:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, error messages, console output, or other relevant information.
    validations:
      required: false
