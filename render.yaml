services:
  - type: web
    name: diet-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DATABASE_URL
        sync: false # cole a connection string pooled do Neon
      - key: DIRECT_URL
        sync: false # cole a connection string direta do Neon (para migrations)
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false # ex.: https://diet-app.onrender.com
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
