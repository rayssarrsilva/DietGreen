services:
  - type: web
    name: diet-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DATABASE_URL
        sync: false # cole a connection string pooled do Neon
      - key: DIRECT_URL
        sync: false # cole a connection string direta do Neon (para migrations)
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false # ex.: https://diet-app.onrender.com
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: SELLER_NAME
        sync: false
      - key: SELLER_DOCUMENT
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: FREE_MONTHLY_BUDGET_BRL
        value: "10"
